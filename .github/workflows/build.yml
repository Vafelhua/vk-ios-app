name: Build iOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install pods
        run: pod install

      - name: Build unsigned app
        run: |
          xcodebuild -workspace vk.xcworkspace \
            -scheme "Oxy Feed" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | tail -120

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "App.app not found"; find build -type d | head -50; exit 1; fi
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          cd package
          zip -r ../OpenVK-native-unsigned.ipa Payload
          cd ..
          ls -la OpenVK-native-unsigned.ipa
          shasum -a 256 OpenVK-native-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenVK-native-unsigned-ipa
          path: OpenVK-native-unsigned.ipa
          retention-days: 30
